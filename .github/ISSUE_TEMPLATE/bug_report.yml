name: Bug report
description: Something in Satori doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't paste API keys, your `.env.local` or your database file** here.
        For a security problem, use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Which question? (if it's about a wrong answer or explanation)
      description: Paste the first line of the question and its skill, or attach a screenshot.
  - type: dropdown
    id: install
    attributes:
      label: How are you running Satori?
      options:
        - npm run dev
        - npm run build + npm start
        - Docker
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, browser and Node version
      placeholder: "Windows 11, Chrome 140, Node 22.13"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
      description: Terminal output or the browser console, if any.
      render: shell
